<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giỏ hàng</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <!-- Đổi đường dẫn CSS cho đúng với dự án của bạn -->
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .cart-page { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    .cart-box { background: #fff; color: #222; border-radius: 12px; padding: 16px; }
    .cart-item { display: grid; grid-template-columns: 80px 1fr auto 120px 32px; gap: 16px; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
    .cart-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; }
    .cart-info { display: flex; flex-direction: column; gap: 4px; }
    .cart-name { color: inherit; font-weight: 600; text-decoration: none; }
    .cart-price { color: #666; font-size: 0.9rem; }
    .cart-qty { display: flex; align-items: center; }
    .cart-qty button { width: 32px; height: 32px; border: 1px solid #ccc; background: #fff; cursor: pointer; font-size: 1rem; }
    .cart-qty button:first-child { border-radius: 6px 0 0 6px; }
    .cart-qty button:last-child { border-radius: 0 6px 6px 0; }
    .cart-qty-input { width: 48px; height: 32px; text-align: center; border: 1px solid #ccc; border-left: 0; border-right: 0; }
    .cart-line { text-align: right; color: #b3261e; }
    .cart-remove { border: 0; background: none; color: #888; font-size: 1.1rem; cursor: pointer; }
    .cart-remove:hover { color: #b3261e; }
    .cart-summary { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
    .cart-total { font-size: 1.3rem; font-weight: 700; color: #b3261e; }
    .cart-checkout { background: #cbb892; color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; }
    .cart-checkout:hover { filter: brightness(1.1); }
    .cart-clear { border: 1px solid #ccc; background: #fff; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
    .cart-empty { text-align: center; padding: 32px 0; }
    @media (max-width: 640px) {
      .cart-item { grid-template-columns: 64px 1fr 32px; }
      .cart-item img { width: 64px; height: 64px; }
      .cart-qty { grid-column: 2; }
      .cart-line { grid-column: 2; text-align: left; }
      .cart-remove { grid-row: 1; grid-column: 3; }
    }
  </style>
</head>
<body>
  <div class="cart-page">
    <p><a href="../pages/products.html" style="color:inherit">← Tiếp tục mua sắm</a></p>
    <h2>Giỏ hàng (<span id="cart-count">0</span>)</h2>

    <div class="cart-box">
      <div id="cart-list"></div>

      <div class="cart-summary" id="cart-summary">
        <button class="cart-clear" id="cart-clear">Xóa tất cả</button>
        <div>Tổng tiền: <span class="cart-total" id="cart-total">0đ</span></div>
        <a class="cart-checkout" href="../pages/checkout.html">Thanh toán</a>
      </div>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/cart.js"></script>
</body>
</html>
